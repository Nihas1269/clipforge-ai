# =============================================================================
# LOCAL DEVELOPMENT ONLY — DO NOT USE IN PRODUCTION
#
# Backing services for running ClipForge AI on a developer machine:
# PostgreSQL, Redis, and MinIO (S3-compatible storage). The application itself
# is not containerized here.
#
# The credential defaults below are development-only values and work without
# a root `.env` file. `.env.example` lists the same values; to override them,
# copy it to a root `.env` file and edit the copy (or export the variables in
# your shell). The `.env` file is ignored by Git.
# All ports are bound to 127.0.0.1 so the services are not exposed on the
# network.
#
# See docs/local-development.md for usage.
# =============================================================================

name: clipforge-dev

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clipforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clipforge_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-clipforge}
    ports:
      # Host port 5433 avoids clashing with a PostgreSQL already running on 5432.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # MinIO no longer publishes pullable community images (docker.io/minio/minio
    # denies anonymous pulls), so this uses pgsty/silo, a community build of the
    # MinIO server (source: https://github.com/pgsty/silo). Pinned by digest so
    # the image cannot change silently. See docs/local-development.md.
    image: docker.io/pgsty/silo:RELEASE.2026-11-12T00-00-00Z@sha256:c20d112390b9a9ce8c11b8af95ad35bcaa62f4759663c09c936cd8d2b511f329
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-clipforge_dev}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-clipforge_dev_password}
    ports:
      - "127.0.0.1:9000:9000" # S3 API
      - "127.0.0.1:9001:9001" # Web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  minio-data:
